<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BlockFit Puzzle · BahaLabs</title>
<meta name="description" content="BlockFit Puzzle: a relaxing block puzzle you can play offline. By BahaLabs.">
<style>
  :root { color-scheme: dark; --fg: #f1effc; --muted: #c9c3ff; --accent: #ffc145; --card: rgba(255,255,255,.07); --line: rgba(255,255,255,.14); }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; color: var(--fg);
         background: radial-gradient(700px 360px at 80% -10%, rgba(140,123,255,.4), transparent 70%),
                     linear-gradient(160deg, #33288a, #15123a);
         font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { width: 100%; max-width: 600px; padding: 40px 16px; text-align: center; }
  .blocks { display: grid; grid-template-columns: repeat(3, 44px); gap: 7px; justify-content: center; }
  .blocks span { width: 44px; height: 44px; border-radius: 11px; box-shadow: inset 0 -4px 0 rgba(0,0,0,.18), inset 0 3px 0 rgba(255,255,255,.25); }
  .blocks span.empty { background: rgba(255,255,255,.06); box-shadow: inset 0 0 0 2px rgba(255,255,255,.08); }
  h1 { font-size: clamp(2.2rem, 8vw, 3rem); line-height: 1.1; margin: 22px 0 8px; letter-spacing: -.01em; }
  .tag { color: var(--muted); margin: 0 0 30px; font-size: 1.05rem; }
  .links { display: grid; gap: 10px; text-align: left; }
  @media (min-width: 560px) { .links { grid-template-columns: 1fr 1fr; } }
  .links a { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 14px;
             background: var(--card); border: 1px solid var(--line); color: var(--fg); text-decoration: none; font-weight: 600; }
  .links a:hover { background: rgba(255,255,255,.12); }
  .links i { flex: none; width: 14px; height: 14px; border-radius: 4px; }
  .links small { display: block; color: var(--muted); font-weight: 400; font-size: .85rem; }
  footer { margin-top: 34px; font-size: .85rem; color: var(--muted); }
</style>
</head>
<body>
<main>
  <div class="blocks" aria-hidden="true">
    <span class="empty"></span><span style="background:#FF6B5A"></span><span style="background:#FFC145"></span>
    <span style="background:#3FC8F2"></span><span style="background:#5BD97A"></span><span style="background:#8C7BFF"></span>
    <span style="background:#FF9F43"></span><span class="empty"></span><span style="background:#FF7FC8"></span>
  </div>
  <h1>BlockFit Puzzle</h1>
  <p class="tag">Fit the blocks. Clear the lines. A relaxing block puzzle you can play offline.</p>

</html>
